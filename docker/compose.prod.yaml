# Устаревший файл. Состав приложения переехал в infra/compose.yaml.
#
# Здесь был production-профиль для ЕДИНОГО образа: приложение, которое само
# раздаёт SPA и ходит в базу. После разделения на два микросервиса этот файл
# развернул бы только бэкенд — то есть стенд без пользовательского входа,
# где API отвечает, а открыть нечего.
#
# Файл оставлен, а не удалён, по одной причине: на него ссылаются старые
# копии документации и, возможно, чьи-то локальные скрипты. Молча удалить
# значит превратить понятную ошибку «не тот compose» в невнятную «файла
# нет».
#
# Актуальный состав:
#
#   infra/compose.yaml          два сервиса + проксирование через nginx
#   infra/releases/*.yml        какой digest каждого сервиса разворачивается
#   infra/ansible/playbooks/    деплой через Ansible
#
# Развёртывание:
#
#   ansible-playbook -i infra/inventories/dev/hosts.yml \
#     infra/ansible/playbooks/deploy.yml \
#     -e release_id=cybra-0.1.0 -e target_env=dev \
#     -e backend_image=<...>@sha256:<...> -e frontend_image=<...>@sha256:<...>
#
# Вручную, без Ansible:
#
#   cd infra
#   printf 'BACKEND_IMAGE=%s\nFRONTEND_IMAGE=%s\n' "<backend@sha256:...>" "<frontend@sha256:...>" > .env
#   printf 'CYBRA_SECRET_KEY=%s\n' "<key>" > backend.env
#   docker compose --env-file .env -f compose.yaml up -d
#
# Документация: docs/DEPLOYMENT.md, docs/ARCHITECTURE.md.

services:
  cybra:
    image: ${CYBRA_IMAGE:?use infra/compose.yaml instead — see the comment above}
    profiles: ["legacy"]
    # Профиль legacy: этот сервис не поднимается по умолчанию даже если
    # файл попал в команду по ошибке. Явный отказ понятнее, чем стенд,
    # который «работает», но показывает 502 на всём, кроме /api.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        echo "docker/compose.prod.yaml устарел: приложение разделено на
        backend и frontend." >&2;
        echo "Используйте infra/compose.yaml — см. docs/DEPLOYMENT.md." >&2;
        exit 1
