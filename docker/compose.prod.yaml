# Production-профиль: развёртывание артефакта из registry, без сборки.
#
# Зачем вообще compose, если хватает docker run: нужен предсказуемый рестарт,
# явный volume и возможность позже вынести scan в отдельный контейнер, не
# переписывая образ.
#
# Почему здесь НЕТ `build:` — это не забывчивость, а суть профиля. С `build:`
# compose собирает образ из локального контекста и молча подменяет тег
# `cybra/cybra:latest`, так что на двух машинах оказываются две разные сборки
# под одним именем. Именно этого и не должно быть: одна и та же развёртка
# у всех. Собирает и публикует только CI (см. .gitlab-ci.yml), сюда приходит
# уже проверенный образ.
#
#   docker login registry.example.com
#   printf 'CYBRA_SECRET_KEY=%s\n' "<key>" > docker/.env
#   docker compose -f docker/compose.prod.yaml pull
#   docker compose -f docker/compose.prod.yaml up -d
#
# Локальная сборка для разработки — docker build напрямую (см. README).

services:
  cybra:
    # Переопределяется через CYBRA_IMAGE, чтобы тот же файл работал и с
    # локальным стендом, и с корпоративным registry.
    image: ${CYBRA_IMAGE:-cybra/cybra:latest}
    # Всегда тянуть из registry: если образа нет локально, compose без этого
    # попытается собрать его из контекста и упадёт с невнятной ошибкой.
    pull_policy: always
    container_name: cybra
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      # Сгенерируйте один раз: python -c "import base64,os;print(base64.urlsafe_b64encode(os.urandom(32)).decode())"
      CYBRA_SECRET_KEY: ${CYBRA_SECRET_KEY:?set CYBRA_SECRET_KEY in .env}
      CYBRA_COOKIE_SECURE: "0"          # включите 1 за HTTPS-прокси
      CYBRA_ENGINE: subprocess
      CYBRA_SESSION_TTL_HOURS: "12"
    volumes:
      - cybra-data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/api/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  cybra-data:
