# Что сканер секретов не должен читать.
#
# gitleaks обходит рабочее дерево целиком, включая каталоги, которых в git
# нет и в CI не будет. `.tools/` — это локальные окружения бенчмарков,
# созданные `cybra setup`: там лежат чужие библиотеки целиком, и в них
# попадаются строки вида `private_key:` из .pyi-заглушек cryptography и
# dns. Секретами это не является, но правило `generic-api-key` их ловит.
#
# Первый прогон SSO упал именно на них: gitleaks нашёл `private_key:` в
# `cryptography/hazmat/bindings/_rust/openssl/hpke.pyi` — файле типовых
# подсказок, а не в нашем коде.
#
# Важно: правила переопределяются ЦЕЛИКОМ. Если объявить [[rules]] с тем
# же id, встроенное правило заменяется на наше — поэтому здесь оно
# повторено полностью, с regex, а не только с allowlist. Конфиг без regex
# gitleaks отвергает: «both |regex| and |path| are empty, this rule will
# have no effect».

title = "CYBRA gitleaks config"

[extend]
# Встроенный набор правил сохраняется: мы добавляем исключения, а не
# выбрасываем проверки. Без этой строки пришлось бы копировать весь
# словарь правил gitleaks в репозиторий.
useDefault = true

[[rules]]
id = "generic-api-key"
description = "Общий шаблон ключа: исключаем каталоги зависимостей и артефактов"
# Тот же шаблон, что у встроенного правила, — иначе он перестанет ловить
# настоящие ключи.
regex = '''(?i)[\w.-]{0,50}?(?:access|auth|(?-i:[Aa]pi|API)|credential|creds|key|passw(?:or)?d|secret|token)(?:[ \t\w.-]{0,20})[\s'"]{0,3}(?:=|>|:{1,3}=|\|\||:|=>|\?=|,)[\x60'"\s=]{0,5}([\w.=-]{10,150}|[a-z0-9][a-z0-9+/]{11,}={0,3})(?:[\x60'"\s;]|\\[nr]|$)'''
entropy = 3.5

[rules.allowlist]
# Пути, где искать секреты бессмысленно: это не наш код.
paths = [
    '''\.tools/''',
    '''\.venv/''',
    '''\.venv312/''',
    '''node_modules/''',
    '''var/''',
    '''var-test/''',
    '''var-test-initpass/''',
    '''backend/static/''',
    '''offline-bundle/''',
    # Тестовый стенд Keycloak. Пароли здесь — часть конфигурации
    # одноразового локального стенда: база Keycloak живёт в контейнере,
    # который удаляется после проверки, и наружу ничего не публикуется.
    # Настоящее развёртывание берёт эти значения из защищённых переменных,
    # а не из файла в репозитории.
    '''infra/keycloak/compose\.yaml''',
    # Манифест realm для того же стенда: client_secret и пароль demo-учётки
    # существуют только чтобы импорт прошёл без ручных кликов.
    '''infra/keycloak/realm-cybra\.json''',
    # Пример переменных с теми же стендовыми значениями.
    '''infra/keycloak/env\.oidc\.example''',
]
