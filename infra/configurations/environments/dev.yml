# Окружение dev: несекретные параметры.
#
# Эти значения читает Ansible и подставляет в Jinja2-шаблоны. Секреты сюда
# не кладутся: они приходят из CI-переменных (protected, masked) и роль
# preflight проверяет их наличие до рендера.
#
# Порт 8080 намеренно отличается от stage (8081) и prod-lab (8082): на
# учебном стенде три окружения могут жить на одной машине, и разделяются
# именно портами и project_name.

cybra_env: dev

# Бэкенд. Публичный адрес нужен только для логов и для проверки health
# снаружи; внутри compose связь идёт по имени сервиса.
backend_upstream: "backend:8000"
api_base_url: "http://localhost:8080"

# Фронтенд слушает этот порт на хосте.
frontend_port: 8080

# Cookie по HTTPS не требуем: dev обычно открыт по http.
cybra_cookie_secure: "0"

# Сессия живёт сутки: на dev перелогиниваться каждые 12 часов мешает.
cybra_session_ttl_hours: "24"

# Подробные логи: на dev они нужны.
cybra_log_level: debug

# База. Пусто — SQLite в томе. Для PostgreSQL раскомментируйте строку ниже
# и поднимите профиль db.
cybra_database_url: ""
# cybra_database_url: "postgresql+psycopg://cybra:CHANGE_ME@db:5432/cybra"

# Ресурсы контейнеров. Ограничения на dev мягкие: прогон с garak любит
# память, а CI-smoke должен укладываться в них, иначе проверка будет
# падать по OOM, а не по делу.
backend_memory: "2g"
frontend_memory: "128m"
