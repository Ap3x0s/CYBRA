# Окружение stage: несекретные параметры.
#
# Отличие от dev намеренно минимальное — ровно то, что требует роадмап:
# «dev и stage получают разные URL при одинаковом digest приложения».
# Всё остальное совпадает, иначе сравнение результатов между стендами
# теряет смысл.

cybra_env: stage

backend_upstream: "backend:8000"
api_base_url: "http://localhost:8081"

# Другой порт: stage и dev могут жить на одной машине.
frontend_port: 8081

cybra_cookie_secure: "0"

# Стандартные 12 часов, как в проде: stage должен вести себя похоже на него.
cybra_session_ttl_hours: "12"

cybra_log_level: info

cybra_database_url: ""

# Ограничения жёстче dev: stage ближе к продовому профилю, и утечка памяти
# здесь должна проявиться, а не остаться незамеченной.
backend_memory: "2g"
frontend_memory: "128m"
