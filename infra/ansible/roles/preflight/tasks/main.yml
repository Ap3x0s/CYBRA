# Роль preflight — подготовка хоста.
#
# Отделена от развёртывания намеренно (роадмап, шаг 12): «отдельная
# подготовка Docker/Compose и отдельное развёртывание приложения». Причина
# практическая — при отладке деплоя нет смысла заново проверять наличие
# docker на каждом прогоне.
#
# Проверки здесь не «на всякий случай»: compose-плагин и BuildKit — разные
# вещи с разными версиями, и их отсутствие даёт ошибку не там, где искать.

- name: Проверить версию Python на хосте
  ansible.builtin.assert:
    that:
      - ansible_python.version.major == 3
      - ansible_python.version.minor >= 8
    fail_msg: "Нужен Python 3.8+ на целевом хосте, найден {{ ansible_python.version }}"
    quiet: true

- name: Проверить поддержку ОС
  ansible.builtin.assert:
    that:
      - ansible_distribution in ['Ubuntu', 'Debian', 'RedHat', 'CentOS', 'Rocky', 'AlmaLinux']
    fail_msg: "Неподдерживаемая ОС: {{ ansible_distribution }}"
    quiet: true

# --- Docker ---------------------------------------------------------
# Ставится только если его нет. Идемпотентность: повторный прогон не
# переустанавливает пакеты и не перезапускает демон.

- name: Проверить наличие docker
  ansible.builtin.command: docker --version
  register: docker_check
  changed_when: false
  failed_when: false

- name: Установить docker, если отсутствует
  when: docker_check.rc != 0
  block:
    - name: Добавить ключ репозитория Docker
      ansible.builtin.get_url:
        url: https://download.docker.com/linux/{{ ansible_distribution | lower }}/gpg
        dest: /etc/apt/keyrings/docker.asc
        mode: "0644"

    - name: Добавить репозиторий Docker
      ansible.builtin.apt_repository:
        repo: >-
          deb [arch={{ ansible_architecture | replace('x86_64', 'amd64') }}
          signed-by=/etc/apt/keyrings/docker.asc]
          https://download.docker.com/linux/{{ ansible_distribution | lower }}
          {{ ansible_distribution_release }} stable
        state: present
        filename: docker

    - name: Установить Docker Engine и Compose-плагин
      ansible.builtin.apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin
        state: present
        update_cache: true

- name: Проверить compose-плагин
  ansible.builtin.command: docker compose version
  register: compose_check
  changed_when: false
  # Compose v2 — это плагин, а не отдельный бинарь `docker-compose`.
  # Роадмап требует именно плагин: community.docker.docker_compose_v2
  # работает только с ним.
  failed_when: compose_check.rc != 0
  ignore_errors: true

- name: Сообщить, если compose-плагина нет
  ansible.builtin.fail:
    msg: >-
      docker compose (плагин v2) не найден. Установите docker-compose-plugin.
      Отдельный бинарь docker-compose не подходит: модуль
      community.docker.docker_compose_v2 работает только с плагином.
  when: compose_check.rc != 0

- name: Проверить, что демон Docker запущен
  ansible.builtin.command: docker info
  register: docker_info
  changed_when: false
  failed_when: docker_info.rc != 0

# --- Каталоги -------------------------------------------------------
# Структура фиксирована: каждый релиз получает свой каталог, старый не
# затирается. Это даёт бесплатную историю и делает откат тривиальным.

- name: Создать каталоги деплоя
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0750"
  loop:
    - "{{ deploy_root }}"
    - "{{ config_dir }}"
    - "{{ deploy_root }}/releases"

# --- Секреты --------------------------------------------------------
# Проверяем ДО рендера: если секрет не пришёл, лучше упасть здесь, чем
# записать в .env пустую строку и получить неработающее шифрование.

- name: Проверить, что секрет бэкенда передан
  ansible.builtin.assert:
    that:
      - cybra_secret_key is defined
      - cybra_secret_key | length >= 32
    fail_msg: >-
      cybra_secret_key не передан или короче 32 символов. Возьмите его из
      защищённой CI-переменной (protected + masked), не из git.
    quiet: true
