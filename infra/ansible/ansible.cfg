# Конфигурация Ansible для деплоя CYBRA.
#
# Ansible здесь — исполнитель CD, а не инструмент настройки хоста с нуля.
# GitLab выбирает, ЧТО развернуть (manifest с digest) и КУДА (inventory),
# Ansible делает это идемпотентно.

[defaults]
# Inventory берётся из переменной окружения при запуске:
#   ansible-playbook -i inventories/dev/hosts.yml playbooks/deploy.yml
# Значение по умолчанию — чтобы не забыть и не запустить против случайного
# хоста.
inventory = inventories/dev/hosts.yml

# Роли лежат рядом с playbook, а не в ~/.ansible — иначе на свежем
# CD-раннере их просто нет.
roles_path = roles

# Отключённые факты ускоряют запуск: нам не нужна информация о железе,
# только docker и compose.
gathering = smart
fact_caching = jsonfile
fact_caching_connection = /tmp/ansible-facts
fact_caching_timeout = 3600

# Вывод без лишнего шума, но с диффом изменений.
stdout_callback = default
display_skipped_hosts = false
display_ok_hosts = true

# Цвета отключены: лог CI читают в веб-интерфейсе, где escape-коды
# превращаются в мусор.
force_color = false

[ssh_connection]
# StrictHostKeyChecking не выключаем: подмена хоста — это ровно то, от чего
# защищает проверка ключа. known_hosts приходит из inventory/group_vars.
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o StrictHostKeyChecking=yes
pipelining = true

[privilege_escalation]
# Docker-группа даёт фактически root, поэтому become нужен только для
# установки пакетов в роли preflight.
become = true
become_method = sudo
become_ask_pass = false
