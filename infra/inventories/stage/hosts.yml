# Inventory окружения stage.
#
# Отличается от dev только адресом и target_env. Это намеренно: playbook,
# роли и compose обязаны быть одинаковыми, иначе проверка на stage говорит
# не о том, что поедет в prod-lab.

all:
  children:
    cybra:
      hosts:
        stage:
          ansible_host: "{{ lookup('env', 'CYBRA_STAGE_HOST') | default('127.0.0.1', true) }}"
          ansible_user: "{{ lookup('env', 'CYBRA_DEPLOY_USER') | default('cybra', true) }}"
          ansible_port: 22
          ansible_python_interpreter: /usr/bin/python3
      vars:
        target_env: stage
        postgres_password: ""
