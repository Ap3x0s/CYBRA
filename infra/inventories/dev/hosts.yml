# Inventory окружения dev.
#
# Один хост на окружение — так требует роадмап на первом варианте.
# Для полного варианта (отдельная VM на dev / stage / prod-lab) достаточно
# поменять здесь адрес: playbook не зависит от того, где живёт хост.
#
# Переменные подключения не хранятся в этом файле. Они приходят из
# group_vars, который собирается CD-джобой из защищённых CI-переменных:
#   ANSIBLE_SSH_KEY   — приватный ключ deploy-пользователя
#   ANSIBLE_KNOWN_HOSTS — проверенный known_hosts
#
# StrictHostKeyChecking не отключается: подмена хоста — ровно то, от чего
# защищает проверка ключа (роадмап, шаг 13).

all:
  children:
    cybra:
      hosts:
        dev:
          ansible_host: "{{ lookup('env', 'CYBRA_DEV_HOST') | default('127.0.0.1', true) }}"
          ansible_user: "{{ lookup('env', 'CYBRA_DEPLOY_USER') | default('cybra', true) }}"
          ansible_port: 22
          ansible_python_interpreter: /usr/bin/python3
      vars:
        target_env: dev
        # Строка подключения к БД для этого окружения: на dev хватает SQLite
        # в томе, поэтому переменная пустая.
        postgres_password: ""
