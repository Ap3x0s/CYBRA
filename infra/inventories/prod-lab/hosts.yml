# Inventory окружения prod-lab.
#
# «lab» — учебный прод, не связанный с настоящим продакшеном заказчика.
# Отдельный хост обязателен: роадмап (шаг 15) требует, чтобы prod-lab не
# получал произвольный образ и не запускался раньше stage.
#
# Секреты этого окружения (SSH-ключ, POSTGRES_PASSWORD, CYBRA_SECRET_KEY)
# живут в защищённых CI-переменных с scope=production. Job, который их
# читает, помечен environment: production и требует ручного запуска —
# кнопка manual сама по себе доступа не разграничивает (роадмап, шаг 15).

all:
  children:
    cybra:
      hosts:
        prod-lab:
          ansible_host: "{{ lookup('env', 'CYBRA_PROD_HOST') | default('127.0.0.1', true) }}"
          ansible_user: "{{ lookup('env', 'CYBRA_DEPLOY_USER') | default('cybra', true) }}"
          ansible_port: 22
          ansible_python_interpreter: /usr/bin/python3
      vars:
        target_env: prod-lab
        # В prod-lab база — PostgreSQL, а не SQLite в томе: состояние не
        # должно жить в файле, который уходит вместе с контейнером.
        postgres_password: "{{ lookup('env', 'POSTGRES_PASSWORD') | default('', true) }}"
        # Порог для health после деплоя: в проде ждём дольше, потому что
        # миграции схемы на пустой базе занимают время.
        health_retries: 45
