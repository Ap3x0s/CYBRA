# nginx для CYBRA frontend.
#
# Задача сервиса — раздать собранную SPA и проксировать /api на бэкенд.
# Почему прокси, а не два порта наружу: `frontend/src/api.js` вызывает
# относительный `/api/v1`, то есть браузер обращается к тому же origin, с
# которого загружена страница. Один origin — нет CORS, нет второй
# конфигурации в бэкенде, нет токенов в кросс-доменных запросах.
#
# Если поменять это место на абсолютный URL бэкенда, сломается и CORS, и
# cookie-аутентификация: сессия живёт в HttpOnly-cookie на этом же домене,
# а SameSite по умолчанию не пропустит её на чужой origin.

server {
    listen 8080;
    listen [::]:8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Не афишируем версию nginx: она не нужна клиенту, а лишняя строка в
    # ответе — подсказка для подбора эксплойта под конкретную версию.
    server_tokens off;

    # Сжатие. Собираемая SPA — это один JS-бандл на несколько сотен
    # килобайт; без gzip он едет целиком при каждом холодном заходе.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types
        application/javascript
        application/json
        application/xml
        image/svg+xml
        text/css
        text/plain;

    # Health-эндпоинт самого фронтенда. Отвечает nginx, не бэкенд: проверка
    # «жив ли контейнер» не должна зависеть от доступности второго сервиса,
    # иначе падение бэкенда красит health и у фронта, и разбор начинается
    # не с того места.
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain always;
        return 200 "ok\n";
    }

    # Проксирование API на бэкенд. Имя `backend` — это имя сервиса в
    # compose-сети (или network-alias при docker run --network).
    #
    # Переменная вместо прямого имени в proxy_pass — не украшение.
    # С прямой формой `proxy_pass http://backend:8000` nginx разрешает имя
    # ОДИН РАЗ, при разборе конфигурации, и падает с
    # `host not found in upstream "backend"`, если бэкенда ещё нет.
    # Последствия два, и оба плохие:
    #   * `nginx -t` нельзя выполнить при сборке образа — а именно там
    #     ошибка в конфиге дешевле всего;
    #   * если бэкенд перезапустится и получит другой IP, nginx продолжит
    #     ходить на старый и будет отдавать 502 до собственного рестарта.
    # С переменной имя разрешается на каждый запрос через resolver.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend_upstream "backend:8000";

    location /api/ {
        proxy_pass http://$backend_upstream;
        proxy_http_version 1.1;

        # Заголовки, по которым бэкенд понимает, кто пришёл: без них в
        # логах и в аудите виден только адрес nginx.
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Прогоны бенчмарков идут минутами, а отчёт генерируется на лету.
        # Дефолтные 60 с обрывали бы долгие запросы на середине.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_connect_timeout 10s;

        # Буферизация ответа: отчёты бывают крупными, и без буфера клиент
        # ждёт генерации целиком, а nginx держит соединение к бэкенду.
        proxy_buffering on;
        proxy_buffer_size 16k;
        proxy_buffers 8 16k;
    }

    # Долгоживущие ассеты Vite содержат хеш в имени, поэтому их можно
    # кешировать навсегда: новое содержимое получит новое имя файла.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA-fallback: любой неизвестный путь — это маршрут react-router, а не
    # 404. Без этой строки перезагрузка страницы на /runs/123 отдаёт 404,
    # хотя переход по ссылке внутри приложения работал.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html кешировать нельзя: в нём имена хешированных бандлов.
    # С кешем браузер после выката продолжит грузить старые файлы, которых
    # на сервере уже нет.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires 0;
    }

    # Заголовки безопасности. CSP здесь намеренно без 'unsafe-eval':
    # собранная Vite-сборка eval не использует, а разрешение открыло бы
    # дорогу инъекциям.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
