# CI/CD для CYBRA — два микросервиса, два пайплайна.
#
# Приложение разделено на backend и frontend. У каждого свой стек, свои
# команды проверок и свой образ, поэтому и пайплайн у каждого свой: правка
# в frontend/** больше не гоняет pytest, а правка в backend/cybra — не
# пересобирает фронт.
#
# Этот файл — только диспетчер. Он решает, какой пайплайн запустить, и
# выполняет проверки, общие для обоих сервисов. Сами 18 шагов схемы живут
# в дочерних файлах:
#
#   .gitlab/ci/pipelines/backend.yml   18 шагов для Python-сервиса
#   .gitlab/ci/pipelines/frontend.yml  18 шагов для Node/nginx-сервиса
#   .gitlab/ci/pipelines/infra.yml     CD: compose, Ansible, манифесты
#
# Почему родитель-потомок, а не три независимых файла: репозиторий один
# (решение по проекту — границы воспроизводятся каталогами, а не
# отдельными проектами GitLab). Parent-child — штатный механизм GitLab
# для этого случая: один граф, но независимые стадии, и красный фронт не
# блокирует бэк.
#
# Соответствие схеме DevSecOps на уровне диспетчера:
#   1  ветка + MR      ✔ workflow:rules (main — только через MR)
#   6  secrets scan    ✔ один раз на весь репозиторий
#   0  pre-commit      ✔ проверка, что хук на месте
# Остальные 15 шагов выполняются в дочерних пайплайнах — по разу на сервис.

stages:
  - validate
  - security
  - trigger

variables:
  # Версия Python и Node зафиксированы здесь, а не в дочерних файлах:
  # сервисы должны собираться на одном мажоре, иначе «работает на бэке,
  # не работает на фронте» превращается в расследование.
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "22"

default:
  retry: 0
  interruptible: true

# Этап 1 схемы — изменения через ветку и запрос на слияние.
#
# Без правила `push → main: never` пайплайн запускался и на прямой push в
# main, то есть обходил ревью. Теперь в main можно попасть только MR.
# Правило стоит ПОСЛЕ разрешающих, иначе перекрыло бы ручной запуск.
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_TAG
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_PIPELINE_SOURCE == "web"
    - if: $CI_PIPELINE_SOURCE == "api"
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: never
    - if: $CI_PIPELINE_SOURCE == "push"

# ======================================================================
# Общие проверки: выполняются один раз, а не по разу на сервис
# ======================================================================

include:
  - local: .gitlab/ci/templates/base.yml

# Этап 0 — локальные pre-commit. Проверяем, что хук на месте: иначе «у
# меня локально проходило» остаётся словами, а сам хук может быть тихо
# удалён при переезде.
repo:precommit:
  stage: validate
  extends: .python
  script:
    - echo "--- скрипты хука на месте ---"
    - test -f scripts/precommit.py
    - test -f scripts/install_git_hooks.py
    - echo "--- проверка структуры репозитория ---"
    - python scripts/check_repo_structure.py

# Этап 6 — Secrets scan. Один раз на весь репозиторий: секрет не зависит
# от того, в каком каталоге он лежит.
#
# entrypoint: [""] обязателен: у образа gitleaks ENTRYPOINT — сам бинарь,
# shell отсутствует, и GitLab падает с `unknown command "sh"`.
repo:secrets:
  stage: security
  image:
    name: zricethezav/gitleaks:latest
    entrypoint: [""]
  script:
    - gitleaks detect --source="$CI_PROJECT_DIR" --no-git --redact --verbose
  allow_failure: false

# Этап 7 — IaC / CI scan. Один раз на весь репозиторий: проверяются оба
# Dockerfile, compose, все пайплайны и workflows.
repo:iac:
  stage: security
  extends: .python
  script:
    - pip install --quiet pyyaml jinja2
    - python scripts/check_iac.py
    - python scripts/check_infra.py

# ======================================================================
# Триггеры дочерних пайплайнов
# ======================================================================
#
# `rules: changes` — то, что делает разделение осмысленным: правка в
# frontend/** не должна запускать pytest, и наоборот.
#
# `changes` не работает на тегах и ручном запуске (там нет диффа), поэтому
# для этих источников условие проверяется отдельно — иначе релизный
# пайплайн не запустил бы ни один сервис.

backend:
  stage: trigger
  needs: [repo:precommit]
  trigger:
    include: .gitlab/ci/pipelines/backend.yml
    strategy: depend
  rules:
    # Ручной запуск, API и тег — собираем всё: состав должен быть полным.
    - if: $CI_PIPELINE_SOURCE == "web"
    - if: $CI_PIPELINE_SOURCE == "api"
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_COMMIT_TAG
    # Иначе — только при изменениях в своих каталогах.
    - changes:
        - backend/**/*
        - scan/**/*
        - security_suite/**/*
        - tests/**/*
        - datasets/**/*
        - vendor/**/*
        - run.py
        - sources.lock.json
        - docker/Dockerfile
        - .gitlab/ci/pipelines/backend.yml
        - .gitlab/ci/templates/base.yml

frontend:
  stage: trigger
  needs: [repo:precommit]
  trigger:
    include: .gitlab/ci/pipelines/frontend.yml
    strategy: depend
  rules:
    - if: $CI_PIPELINE_SOURCE == "web"
    - if: $CI_PIPELINE_SOURCE == "api"
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_COMMIT_TAG
    - changes:
        - frontend/**/*
        - .gitlab/ci/pipelines/frontend.yml
        - .gitlab/ci/templates/base.yml

infra:
  stage: trigger
  needs: [repo:iac]
  trigger:
    include: .gitlab/ci/pipelines/infra.yml
    strategy: depend
  rules:
    - if: $CI_PIPELINE_SOURCE == "web"
    - if: $CI_PIPELINE_SOURCE == "api"
    - if: $CI_COMMIT_TAG
    - changes:
        - infra/**/*
        - docker/**/*
        - .gitlab/ci/pipelines/infra.yml
        - .gitlab/ci/templates/base.yml
