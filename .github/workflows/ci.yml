# Устаревший workflow. Разделён на backend.yml и frontend.yml.
#
# Здесь был единый пайплайн для монолитного образа: он собирал SPA в
# Python-контейнер и гонял все проверки сразу. После разделения на два
# микросервиса это перестало быть верным:
#
#   * правка в .jsx запускала pytest, а правка в backend/cybra —
#     пересобирала фронт;
#   * образ собирался один, а сервисов теперь два;
#   * check_github_workflow.py проверяет job'ы во всех файлах, и
#     устаревший workflow создавал бы ложное впечатление, что он ещё
#     что-то делает.
#
# Файл оставлен, а не удалён: на имя `CI` могут быть завязаны branch
# protection и required checks в настройках репозитория. Удаление сделало
# бы их висящими ссылками без объяснения, почему проверки перестали
# приходить.
#
# Актуальные workflow:
#   .github/workflows/backend.yml   — 18 шагов для Python-сервиса
#   .github/workflows/frontend.yml  — 18 шагов для Node/nginx-сервиса
#
# Триггеры на push и pull_request убраны намеренно: иначе workflow
# появлялся бы в списке проверок MR пустым и выглядел сломанным.

name: CI (устарел — см. backend.yml и frontend.yml)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  obsolete:
    runs-on: ubuntu-latest
    steps:
      - name: Объяснить, куда переехали проверки
        run: |
          echo "Этот workflow разделён на два."
          echo ""
          echo "  backend.yml   — Python-сервис: ruff, pytest, kaniko, smoke API"
          echo "  frontend.yml  — Node/nginx-сервис: npm, kaniko, smoke SPA и прокси"
          echo ""
          echo "Схема DevSecOps (18 шагов) выполняется в каждом из них."
