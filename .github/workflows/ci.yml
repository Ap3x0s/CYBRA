name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e backend
          pip install pytest httpx ruff
      - name: Lint
        run: ruff check backend scan --config backend/pyproject.toml
      - name: Tests
        run: pytest tests/test_api.py tests/test_scan.py -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install
        working-directory: frontend
        run: npm ci --no-audit --no-fund
      - name: Build
        working-directory: frontend
        run: npm run build

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Static Dockerfile checks
        run: |
          pip install -e backend
          python scripts/check_dockerfile.py
      - name: Build image
        run: docker build -f docker/Dockerfile -t cybra/cybra:ci .
      - name: Smoke test
        run: |
          docker run -d --name cybra-ci -p 8000:8000 cybra/cybra:ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/api/v1/health; then exit 0; fi
            sleep 2
          done
          echo "health check failed"; docker logs cybra-ci; exit 1
