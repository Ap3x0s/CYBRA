name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e backend
          pip install pytest httpx ruff
      - name: Lint
        # Without --config: ruff finds ruff.toml in the repo root, where the
        # per-file-ignores are written relative to the root. Pointing it at
        # backend/pyproject.toml made ruff resolve "cybra/api.py" from backend/
        # into backend/backend/cybra/api.py, so 83 B008 findings fired on every
        # FastAPI route despite the ignore being declared.
        run: ruff check backend scan
      - name: Tests
        run: pytest tests/ -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install
        working-directory: frontend
        run: npm ci --no-audit --no-fund
      - name: Build
        working-directory: frontend
        run: npm run build

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Static Dockerfile checks
        run: |
          pip install -e backend
          python scripts/check_dockerfile.py
      - name: Build image
        run: docker build -f docker/Dockerfile -t cybra/cybra:ci .
      - name: Smoke test
        run: |
          docker run -d --name cybra-ci -p 8000:8000 cybra/cybra:ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/api/v1/health; then exit 0; fi
            sleep 2
          done
          echo "health check failed"; docker logs cybra-ci; exit 1
