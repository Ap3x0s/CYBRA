[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cybra-backend"
version = "0.1.0"
description = "CYBRA: LLM security benchmark runner with a web console"
license = { text = "Apache-2.0" }
authors = [{ name = "Ap3x0s" }]
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "sqlalchemy>=2.0",
    # Драйвер PostgreSQL. [binary] тянет готовые колёса с libpq внутри, поэтому
    # в python:3.12-slim (Debian) не нужны ни libpq-dev, ни компилятор.
    # Без этой строки образ работал только на SQLite: CYBRA_DATABASE_URL с
    # postgresql+psycopg падал на импорте модуля драйвера.
    "psycopg[binary]>=3.1",
    "pyyaml>=6",
    "argon2-cffi>=23",
    "cryptography>=42",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.4"]

[project.scripts]
cybra = "cybra.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["cybra*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# E/F: pycodestyle and pyflakes errors. I: import order. B: bugbear.
# UP is deliberately off: the project supports Python 3.10 and quoted forward
# references in the Protocol definitions are intentional.
select = ["E", "F", "I", "B"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# FastAPI's dependency injection is expressed as a call in the default value;
# B008 flags every route signature, which is the framework's normal style.
#
# Пути считаются от КАТАЛОГА ЭТОГО ФАЙЛА (backend/), а не от корня репозитория.
# С префиксом "backend/" правило не срабатывало: ruff склеивал путь в
# backend/backend/cybra/api.py, файл не совпадал, и 83 замечания B008 сыпались
# на каждый маршрут, хотя комментарий обещал обратное.
"cybra/api.py" = ["B008"]
"cybra/security.py" = ["B008"]
# scan/ лежит вне этого конфига, поэтому его исключения живут в корневом
# ruff.toml — там же, откуда ruff его и читает.

